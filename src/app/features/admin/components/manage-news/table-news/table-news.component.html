<div class="table-container">
    <h1>Noticias agregadas</h1>

    <hr>

    <mat-form-field class="filter">
        <mat-label>Filtro</mat-label>
        <input matInput (keyup)="applyFilter($event)" #input>
    </mat-form-field>

    <mat-table mat-table [dataSource]="dataSource">

        <ng-container matColumnDef="newsType" class="mat-elevation-z8 ">
            <th mat-header-cell *matHeaderCellDef> Tipo </th>
            <td mat-cell *matCellDef="let element"> {{element.newsType}} </td>
        </ng-container>

        <ng-container matColumnDef="title" class="mat-column-type">
            <th mat-header-cell *matHeaderCellDef> Título </th>
            <td mat-cell *matCellDef="let element"> {{element.title}} </td>
        </ng-container>

        <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef> Descripción </th>
            <td mat-cell *matCellDef="let element"> {{element.description}} </td>
        </ng-container>

        <ng-container matColumnDef="link">
            <th mat-header-cell *matHeaderCellDef> Enlace </th>
            <td class="mat-column-link" mat-cell *matCellDef="let element"> {{element.link.slice(0, 30) }}... </td>
        </ng-container>

        <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef> Fecha </th>
            <td mat-cell *matCellDef="let element"> {{element.date}} </td>
        </ng-container>

        <ng-container matColumnDef="modify">
            <th mat-header-cell *matHeaderCellDef> Modificar </th>
            <td mat-cell *matCellDef="let element"> <img (click)="updateNews(element)" class="img-table" src="../../../../../assets/images/editar.png" alt="edit"> </td>
        </ng-container>

        <ng-container matColumnDef="delete">
            <th mat-header-cell *matHeaderCellDef> Eliminar </th>
            <td mat-cell *matCellDef="let element"> <img (click)="deleteNews(element.id)" class="img-table" src="../../../../../assets/images/basura.png" alt="delete"> </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </mat-table>

    <br><br>
    
    <a (click)="redirectToManageNews()">Volver</a>
</div>
