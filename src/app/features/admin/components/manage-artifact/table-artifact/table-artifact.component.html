<div class="table-container">
    <h1>Set de artefactos agregados</h1>

    <hr>

    <mat-form-field class="filter">
        <mat-label>Filtro</mat-label>
        <input matInput (keyup)="applyFilter($event)" #input>
    </mat-form-field>

    <mat-table mat-table [dataSource]="dataSource">

        <ng-container matColumnDef="set" class="mat-elevation-z8 ">
            <th mat-header-cell *matHeaderCellDef> Set </th>
            <td mat-cell *matCellDef="let element"> {{element.set}} </td>
        </ng-container>

        <ng-container matColumnDef="flower" class="mat-column-type">
            <th mat-header-cell *matHeaderCellDef> Flor </th>
            <td mat-cell *matCellDef="let element"> {{element.flower.pieceName}} </td>
        </ng-container>

        <ng-container matColumnDef="feather">
            <th mat-header-cell *matHeaderCellDef> Pluma </th>
            <td mat-cell *matCellDef="let element"> {{element.feather.pieceName}} </td>
        </ng-container>

        <ng-container matColumnDef="sands">
            <th mat-header-cell *matHeaderCellDef> Reloj </th>
            <td mat-cell *matCellDef="let element"> {{element.sands.pieceName}} </td>
        </ng-container>

        <ng-container matColumnDef="goblet">
            <th mat-header-cell *matHeaderCellDef> Caliz </th>
            <td mat-cell *matCellDef="let element"> {{element.goblet.pieceName}} </td>
        </ng-container>

        <ng-container matColumnDef="circlet">
            <th mat-header-cell *matHeaderCellDef> Casco </th>
            <td mat-cell *matCellDef="let element"> {{element.circlet.pieceName}} </td>
        </ng-container>

        <ng-container matColumnDef="image">
            <th mat-header-cell *matHeaderCellDef> Imagen </th>
            <td mat-cell *matCellDef="let element"> 
                <img class="preview-img" src="{{element.image}}" alt="artifact image">
            </td>
        </ng-container>

        <ng-container matColumnDef="modify">
            <th mat-header-cell *matHeaderCellDef> Modificar </th>
            <td mat-cell *matCellDef="let element"> <img (click)="updateArtifactSet(element)" class="img-table" src="../../../../../assets/images/editar.png" alt="edit"> </td>
        </ng-container>

        <ng-container matColumnDef="delete">
            <th mat-header-cell *matHeaderCellDef> Eliminar </th>
            <td mat-cell *matCellDef="let element"> <img (click)="deleteArtifactSet(element.id)" class="img-table" src="../../../../../assets/images/basura.png" alt="delete"> </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </mat-table>

    <br><br>
    
    <a (click)="redirectToManageArtifact()">Volver</a>
</div>
