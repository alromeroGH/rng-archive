<div class="container">
    <div *ngIf="updateButton">
        <h1>Editar unidad</h1>
    </div>

    <div *ngIf="!updateButton">
        <h1>Unidad</h1>
    </div>

    <hr>

    <form class="form">
        <mat-form-field>
            <mat-label>Tipo</mat-label>
                <mat-select [formControl]="unitTypeFormControl" [compareWith]="compareUnitType" required>
                    <mat-option>--</mat-option>
                    <mat-option *ngFor="let type of unitType" [value]="type">
                        {{type.name}}
                    </mat-option>
                </mat-select>
                <mat-error *ngIf="unitTypeFormControl.hasError('required')">
                    El tipo de unidad es <strong>requerido</strong>
                </mat-error>
        </mat-form-field>

        <mat-form-field class="full-width">
            <mat-label class="input">Nombre</mat-label>
            <input matInput [formControl]="unitNameFormControl">
    
        <mat-error *ngIf="unitNameFormControl.hasError('required')">
            El nombre es <strong>requerido</strong>
        </mat-error>
        </mat-form-field>

        <mat-form-field>
            <mat-label>Numero de estrellas</mat-label>
                <mat-select [formControl]="numberOfStarsFormControl" [compareWith]="compareNumberOfStars" required>
                    <mat-option>--</mat-option>
                    <mat-option *ngFor="let type of numberOfStars" [value]="type">
                        {{type.name}}
                    </mat-option>
                </mat-select>
                <mat-error *ngIf="numberOfStarsFormControl.hasError('required')">
                    El número de estrellas es <strong>requerido</strong>
                </mat-error>
        </mat-form-field>

        <mat-form-field>
            <mat-label>Tipo de banner al que pertenece</mat-label>
                <mat-select [formControl]="bannerTypeFormControl" [compareWith]="compareBannerType" required>
                    <mat-option>--</mat-option>
                    <mat-option *ngFor="let type of bannerType" [value]="type">
                        {{type.name}}
                    </mat-option>
                </mat-select>
                <mat-error *ngIf="bannerTypeFormControl.hasError('required')">
                    El tipo de banner es <strong>requerido</strong>
                </mat-error>
        </mat-form-field>

        <div class="image-upload-container">
            <label for="set-image" class="upload-label">
                Seleccionar Imagen de la unidad (.png)
            </label>
            <input 
                type="file" 
                id="set-image" 
                (change)="onFileSelected($event)" 
                accept="image/png" 
                style="display: none;">

            <div *ngIf="imageBase64" class="image-preview">
                <img [src]="imageBase64" alt="Previsualización de la unidad" class="preview-img">
            </div>
        </div>

        <div class="button-container">
            <div *ngIf="updateButton">
                <button (click)="updateUnit()">Editar</button>
            </div>

            <div *ngIf="!updateButton">
                <button (click)="addUnit()">Agregar</button>
            </div>

            <button (click)="cancel()">Cancelar</button>
        </div>
        <br><br>
        <a (click)="redirectToTableUnit()">Historial de unidades</a>
    </form>
</div>
