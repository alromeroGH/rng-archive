<a (click)="redirectToManageUnit()"><img class="back" src="../../../../../assets/images/flecha-izquierda.png" alt=""></a>
<div class="table-container">
    <h1>Unidades agregadas</h1>

    <hr>

    <mat-form-field class="filter">
        <mat-label>Filtro</mat-label>
        <input matInput (keyup)="applyFilter($event)" #input>
    </mat-form-field>

    <mat-table mat-table [dataSource]="dataSource">

        <ng-container matColumnDef="unitType" class="mat-elevation-z8 ">
            <th mat-header-cell *matHeaderCellDef> Tipo </th>
            <td mat-cell *matCellDef="let element"> {{element.unitType}} </td>
        </ng-container>

        <ng-container matColumnDef="unitName" class="mat-column-type">
            <th mat-header-cell *matHeaderCellDef> Nombre </th>
            <td mat-cell *matCellDef="let element"> {{element.unitName}} </td>
        </ng-container>

        <ng-container matColumnDef="numberOfStars">
            <th mat-header-cell *matHeaderCellDef> Numero de estrellas </th>
            <td mat-cell *matCellDef="let element"> {{element.numberOfStars}} </td>
        </ng-container>

        <ng-container matColumnDef="unitBanner">
            <th mat-header-cell *matHeaderCellDef> Tipo de banner </th>
            <td mat-cell *matCellDef="let element"> {{element.unitBanner}} </td>
        </ng-container>

        <ng-container matColumnDef="unitImage">
            <th mat-header-cell *matHeaderCellDef> Imagen </th>
            <td mat-cell *matCellDef="let element"> 
                <img class="preview-img" src="{{element.unitImage}}" alt="unit image">
            </td>
        </ng-container>

        <ng-container matColumnDef="modify">
            <th mat-header-cell *matHeaderCellDef> Modificar </th>
            <td mat-cell *matCellDef="let element"> <img (click)="updateUnit(element)" class="img-table" src="../../../../../assets/images/editar.png" alt="edit"> </td>
        </ng-container>

        <ng-container matColumnDef="delete">
            <th mat-header-cell *matHeaderCellDef> Eliminar </th>
            <td mat-cell *matCellDef="let element"> <img (click)="deleteUnit(element.id)" class="img-table" src="../../../../../assets/images/basura.png" alt="delete"> </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </mat-table>
</div>
