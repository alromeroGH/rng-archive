 <div class="container">
    emial: admin@gmail.com
    <br>
    constraseña: admin1234
    <h1>Bienvenido</h1>
    
    <hr>

    <form class="form">
        <mat-form-field class="full-width">
            <mat-label class="input">Email</mat-label>
            <input type="email" matInput [formControl]="emailFormControl" placeholder="Ex. pat@example.com">
    
        <mat-error *ngIf="emailFormControl.hasError('email') && !emailFormControl.hasError('required')">
            Ingresar un mail válido
        </mat-error>
        <mat-error *ngIf="emailFormControl.hasError('required')">
            El email es <strong>requerido</strong>
        </mat-error>
        </mat-form-field>

        <mat-form-field class="full-width">
            <mat-label class="input">Constraseña</mat-label>
            <input type="password" matInput [formControl]="passwordFormControl">

        <mat-error *ngIf="passwordFormControl.hasError('required')">
            La constraseña es <strong>requerida</strong>
        </mat-error>
        </mat-form-field>

        <div>
            <button (click)="login()">Iniciar sesión</button>
            <br><br>
            <a routerLink="/register">registrarse</a>
        </div>

    </form>
</div>
